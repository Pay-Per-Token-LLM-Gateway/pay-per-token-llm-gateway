services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: x402_gateway
      POSTGRES_USER: x402
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U x402 -d x402_gateway']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?error}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.gateway
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: '0.0.0.0'
      DATABASE_URL: postgresql://x402:${POSTGRES_PASSWORD}@postgres:5432/x402_gateway
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STELLAR_NETWORK: mainnet
      HORIZON_URL: https://horizon.stellar.org
      SOROBAN_RPC_URL: https://soroban-mainnet.stellar.org
      USDC_ISSUER: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
      JWT_SECRET: ${JWT_SECRET:?error}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,https://x402-dashboard.vercel.app}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  dashboard:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:3000
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
