# ── Gateway Deployment ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-gateway
  namespace: x402-gateway
  labels:
    app.kubernetes.io/name: x402-gateway
    app.kubernetes.io/part-of: pay-per-token-llm-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: x402-gateway
  template:
    metadata:
      labels:
        app: x402-gateway
    spec:
      containers:
        - name: gateway
          image: pay-per-token-llm-gateway/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: x402-config
          env:
            # Database URL from secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: DATABASE_URL
            # Redis URL from secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: REDIS_URL
            # JWT secret from secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
---
# ── Gateway Service ────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: x402-gateway
  namespace: x402-gateway
  labels:
    app.kubernetes.io/name: x402-gateway
    app.kubernetes.io/part-of: pay-per-token-llm-gateway
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
      protocol: TCP
  selector:
    app: x402-gateway