# Sensitive environment variables.
# For production, replace the placeholder values below with your own:
#
#   1. Generate a JWT_SECRET:
#        openssl rand -hex 64
#   2. Set your DATABASE_URL and REDIS_URL to point to your managed PostgreSQL / Redis
#      (or use the in-cluster Postgres and Redis from postgres.yaml / redis.yaml).
#   3. Apply the secret:
#        kubectl create secret generic x402-secrets \
#          --namespace x402-gateway \
#          --from-literal=DATABASE_URL='postgresql://x402:x402_dev_password@x402-postgres:5432/x402_gateway' \
#          --from-literal=REDIS_URL='redis://x402-redis:6379' \
#          --from-literal=JWT_SECRET='change-me-to-a-random-64-byte-hex-string' \
#          --dry-run=client -o yaml | kubectl apply -f -
#
#   Or edit secret.yaml below and replace the placeholder values.
#   ⚠️  base64 is NOT encryption — store this file in a vault or sealed-secrets controller.
# ---
apiVersion: v1
kind: Secret
metadata:
  name: x402-secrets
  namespace: x402-gateway
  labels:
    app.kubernetes.io/name: x402-secrets
    app.kubernetes.io/part-of: pay-per-token-llm-gateway
type: Opaque
stringData:
  # ── PostgreSQL password ──────────────────────────────────────
  POSTGRES_PASSWORD: "x402_dev_password"

  # ── Database URL ─────────────────────────────────────────────
  # When using the in-cluster Postgres from postgres.yaml:
  DATABASE_URL: "postgresql://x402:x402_dev_password@x402-postgres:5432/x402_gateway"

  # ── Redis ─────────────────────────────────────────────────
  # When using the in-cluster Redis from redis.yaml:
  REDIS_URL: "redis://x402-redis:6379"

  # ── Security ──────────────────────────────────────────────
  JWT_SECRET: "change-me-to-a-random-64-byte-hex-string"

  # ── Upstream LLM API keys (optional) ──────────────────────
  # UPSTREAM_API_KEY_E2E_PROVIDER_001: "sk-..."