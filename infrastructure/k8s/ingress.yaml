apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: x402-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: gateway.x402.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: x402-gateway
            port:
              number: 80
  - host: dashboard.x402.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: x402-dashboard
            port:
              number: 80
