apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: x402-gateway
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: x402-gateway
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: x402_gateway
            - name: POSTGRES_USER
              value: x402
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: DATABASE_URL
                  optional: true
            # fallback for dev — replace via secret in prod
          envFrom:
            - secretRef:
                name: x402-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "x402", "-d", "x402_gateway"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "x402", "-d", "x402_gateway"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: x402-gateway
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
