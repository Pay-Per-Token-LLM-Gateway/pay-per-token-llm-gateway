apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: x402-gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/pay-per-token-llm-gateway/gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: x402-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: x402-gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
      name: http
    - port: 80
      targetPort: 3000
      name: http-alt
