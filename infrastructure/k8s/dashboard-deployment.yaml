apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x402-dashboard
  template:
    metadata:
      labels:
        app: x402-dashboard
    spec:
      containers:
      - name: dashboard
        image: devyeyostellar/pay-per-token-llm-dashboard:latest
        ports:
        - containerPort: 3001
