apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: x402-gateway
  template:
    metadata:
      labels:
        app: x402-gateway
    spec:
      containers:
      - name: gateway
        image: devyeyostellar/pay-per-token-llm-gateway:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: x402-config
        - secretRef:
            name: x402-secrets
