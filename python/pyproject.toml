[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x402-sdk"
version = "0.1.0"
description = "Python SDK for x402 — automatic 402 → pay → retry for LLM gateways, with LangChain integration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "x402 contributors" }]
keywords = ["x402", "stellar", "402", "llm", "payment", "langchain", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "httpx>=0.24",
  "stellar-sdk>=11,<16",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Pay-Per-Token-LLM-Gateway/pay-per-token-llm-gateway"
Documentation = "https://github.com/Pay-Per-Token-LLM-Gateway/pay-per-token-llm-gateway/tree/main/python"
Source = "https://github.com/Pay-Per-Token-LLM-Gateway/pay-per-token-llm-gateway"

[tool.hatch.build.targets.wheel]
packages = ["x402_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
