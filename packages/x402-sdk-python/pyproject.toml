[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-sdk"
version = "0.1.0"
authors = [
  { name="x402 Contributors" },
]
description = "Python client SDK for the x402 L402 protocol on Stellar"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "stellar-sdk>=9.0.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]

[project.urls]
"Homepage" = "https://github.com/Pay-Per-Token-LLM-Gateway/pay-per-token-llm-gateway"
